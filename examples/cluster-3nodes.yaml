# microkind 3-node cluster configuration with default CNI (kube-router)
kind: Cluster
apiVersion: fckind.io/v1alpha1
name: microkind

networking:
  podSubnet: "10.244.0.0/16"       # Pod IP CIDR
  serviceSubnet: "10.96.0.0/12"    # Service IP CIDR
  cni:
    provider: kube-router          # Default built-in CNI (kube-proxy enabled)
  apiServerPort: 6443              # Optional host port forward to Kubernetes API

k0s:
  version: "v1.37.2+k0s.0"
  storage:
    type: "kine"                   # "kine" (embedded SQLite) or "etcd" (HA)

nodes:
  - role: control-plane
    vcpus: 2
    memoryMiB: 2048
    diskSizeGiB: 20

  - role: worker
    vcpus: 2
    memoryMiB: 4096
    diskSizeGiB: 20

  - role: worker
    vcpus: 2
    memoryMiB: 4096
    diskSizeGiB: 20
